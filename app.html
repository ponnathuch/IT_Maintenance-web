  function icon(name, size) {
    var sz = size || 17;
    var span = document.createElement('span');
    span.setAttribute('aria-hidden', 'true');
    span.style.display = 'inline-flex';
    span.style.alignItems = 'center';
    span.innerHTML = '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (SVG_PATHS[name] || '') + '</svg>';
    return span;
  }

  // ---------------- DOM & Format Helpers ----------------
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function btn(label, cls, onClick, ic) {
    var b = el('button', 'btn' + (cls ? ' ' + cls : ''));
    b.type = 'button';
    if (ic) b.appendChild(icon(ic, 16));
    if (label) b.appendChild(el('span', '', label));
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }

  function thaiDate(iso) {
    if (!iso || iso.length < 10) return '-';
    var p = iso.slice(0, 10).split('-').map(Number);
    if (!p[0]) return iso;
    return p[2] + ' ' + TH_MONTHS[p[1] - 1] + ' ' + (p[0] + 543);
  }

  function thaiMonth(ym) {
    if (!ym || ym.length < 7) return '-';
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
    return TH_MONTHS_FULL[m - 1] + ' ' + (y + 543);
  }

  function shiftMonth(ym, delta) {
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + delta;
    var d = new Date(Date.UTC(y, m, 1));
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
  }

  function bkkToday() {
    var d = new Date(Date.now() + 7 * 3600 * 1000);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }

  function bkkTimeHm(iso) {
    if (!iso) return '-';
    var ms = Date.parse(iso);
    if (!Number.isFinite(ms)) return '-';
    var d = new Date(ms + 7 * 3600 * 1000);
    return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ' น.';
  }

  function thaiRelativeTime(iso, nowIso) {
    if (!iso) return '-';
    var t = Date.parse(iso);
    var ref = nowIso ? Date.parse(nowIso) : Date.now();
    if (!Number.isFinite(t) || !Number.isFinite(ref)) return '-';
    var diffSec = Math.max(0, Math.round((ref - t) / 1000));
    if (diffSec < 60) return 'เมื่อสักครู่';
    var diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return diffMin + ' นาทีที่แล้ว';
    var diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return diffHr + ' ชั่วโมงที่แล้ว';
    var diffDay = Math.round(diffHr / 24);
    return diffDay + ' วันที่แล้ว';
  }

  function statusInfo(ev) {
    if (ev.status === 'submitted') return { text: 'ตรงเวลา', short: 'ครบ', cls: 'st-submitted', badge: 'ok' };
    if (ev.status === 'late') {
      var pen = ev.penalty ? '-' + ev.penalty : '-2';
      return { text: 'ส่งช้า (' + pen + ')', short: pen, cls: 'st-late', badge: 'warn' };
    }
    if (ev.status === 'missing') return { text: 'ไม่ส่ง (-10)', short: '-10', cls: 'st-missing', badge: 'err' };
    if (ev.status === 'cancelled') return { text: 'ยกเลิก', short: 'ยกเลิก', cls: 'st-cancelled', badge: 'muted' };
    if (ev.status === 'in_progress') {
      return { text: ev.overdue ? 'กำลังทำ (เลยกำหนด)' : 'กำลังทำ', short: 'ทำอยู่', cls: ev.overdue ? 'st-overdue' : 'st-in_progress', badge: ev.overdue ? 'err' : 'brand' };
    }
    return { text: ev.overdue ? 'เลยกำหนด' : 'รอทำ', short: ev.overdue ? 'เลย' : 'รอ', cls: ev.overdue ? 'st-overdue' : 'st-pending', badge: ev.overdue ? 'err' : 'muted' };
  }

  function makeSelect(options, currentValue, onChange, ariaLabel) {
    var wrap = el('div', 'cselect');
    var listId = 'csl-' + Math.random().toString(36).slice(2, 9);
    var trigger = el('button', 'cselect-btn');
    trigger.type = 'button';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-controls', listId);
    if (ariaLabel) trigger.setAttribute('aria-label', ariaLabel);

    var lblSpan = el('span', '');
    var chev = icon('chevDown', 15);
    chev.className = 'chev';
    trigger.appendChild(lblSpan);
    trigger.appendChild(chev);

    var list = el('ul', 'cselect-list');
    list.id = listId;
    list.setAttribute('role', 'listbox');
    list.hidden = true;

    var val = String(currentValue === undefined || currentValue === null ? '' : currentValue);
    var activeIdx = 0;

    function syncLabel() {
      var found = options.find(function (o) { return String(o.value) === val; }) || options[0];
      lblSpan.textContent = found ? found.label : '-';
    }

    function renderOpts() {
      list.innerHTML = '';
      options.forEach(function (o, idx) {
        var li = el('li', 'cselect-opt');
        li.setAttribute('role', 'option');
        var sel = String(o.value) === val;
        li.setAttribute('aria-selected', sel ? 'true' : 'false');
        if (idx === activeIdx) li.classList.add('active');
        li.appendChild(el('span', '', o.label));
        if (sel) li.appendChild(icon('check', 14));
        li.addEventListener('click', function () {
          val = String(o.value);
          syncLabel();
          close();
          if (onChange) onChange(val);
        });
        list.appendChild(li);
      });
    }

    function open() {
      activeIdx = Math.max(0, options.findIndex(function (o) { return String(o.value) === val; }));
      renderOpts();
      list.hidden = false;
      trigger.setAttribute('aria-expanded', 'true');
    }

    function close() {
      list.hidden = true;
      trigger.setAttribute('aria-expanded', 'false');
    }

    openSelects.push(function (target) {
      if (!wrap.contains(target)) close();
    });

    trigger.addEventListener('click', function () {
      if (list.hidden) open(); else close();
    });

    trigger.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (list.hidden) {
          open();
        } else if (e.key === 'Enter' || e.key === ' ') {
          var chosen = options[activeIdx];
          if (chosen) {
            val = String(chosen.value);
            syncLabel();
            close();
            if (onChange) onChange(val);
          }
        } else if (e.key === 'ArrowDown') {
          activeIdx = Math.min(options.length - 1, activeIdx + 1);
          renderOpts();
        } else if (e.key === 'ArrowUp') {
          activeIdx = Math.max(0, activeIdx - 1);
          renderOpts();
        }
      } else if (e.key === 'Home' && !list.hidden) {
        e.preventDefault(); activeIdx = 0; renderOpts();
      } else if (e.key === 'End' && !list.hidden) {
        e.preventDefault(); activeIdx = options.length - 1; renderOpts();
      } else if (e.key === 'Escape' && !list.hidden) {
        e.preventDefault(); close(); trigger.focus();
      }
    });

    syncLabel();
    wrap.appendChild(trigger);
    wrap.appendChild(list);
    wrap.getValue = function () { return val; };
    wrap.setValue = function (nv) { val = String(nv); syncLabel(); };
    return wrap;
  }

  // ---------------- Modal Helper ----------------
  function openModal(title, renderFn) {
    $('modalTitle').textContent = title;
    var body = $('modalBody');

    $('modalClose').focus();

  function postFn(fnName, body, headers) {

    return fetch(SUPABASE_URL + '/functions/v1/' + fnName, {

        function (d) { return { status: r.status, data: d }; },
        function () { return { status: r.status, data: null }; }

      return { status: 0, data: null };

  }

      if (r.status === 401) {
        sessionStorage.removeItem(STORE_KEY);
        var e401 = new Error(errText(r.data && r.data.error));
        e401.status = 401;
        throw e401;
      }
      if (r.status === 0) {
        var eNet = new Error('เชื่อมต่ออินเทอร์เน็ตไม่ได้');
        eNet.offline = true;

      if (r.status !== 200) {
        var err = new Error(errText(r.data && r.data.error));
        err.code = r.data && r.data.error;
        err.data = r.data;
        throw err;
      }
      return r.data;

  function resizePhoto(file, maxEdge, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('อ่านไฟล์รูปไม่ได้')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('ไฟล์รูปไม่ถูกต้อง')); };
        img.onload = function () {
          var w = img.width, h = img.height;
          if (Math.max(w, h) > maxEdge) {
            var scale = maxEdge / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          var dataUrl = cv.toDataURL('image/jpeg', quality);
          resolve({ mime: 'image/jpeg', b64: dataUrl.split(',')[1] });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function excelDateToIso(val) {
    var s = String(val || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
      var y = Number(m[3]);
      if (y > 2400) y -= 543;
      return y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    }
    var num = Number(s);
    if (Number.isFinite(num) && num > 40000 && num < 60000) {
      var dt = new Date(Date.UTC(1899, 11, 30) + Math.round(num) * 86400000);
      return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0') + '-' + String(dt.getUTCDate()).padStart(2, '0');
    }
    return s;
  }

  function readXlsxFirstSheet(file) {

          off: dv.getUint32(p + 42, true)

  // Glide + liquid-stretch the optical glass capsule between tabs/buttons
  function syncLiquidRail(rail, activeBtn, animate) {
    if (!rail || !activeBtn) return;
    var rRect = rail.getBoundingClientRect();
    var bRect = activeBtn.getBoundingClientRect();
    if (rRect.width === 0 || bRect.width === 0) return;

    rail.classList.add('liquid-rail', 'has-liquid');
    var pill = rail.querySelector(':scope > .liquid-pill');
    if (!pill) {
      pill = document.createElement('span');
      pill.className = 'liquid-pill';
      pill.setAttribute('aria-hidden', 'true');
      rail.insertBefore(pill, rail.firstChild);
    }

      x: bRect.left - rRect.left + rail.scrollLeft,
      y: bRect.top - rRect.top + rail.scrollTop,
      w: bRect.width,
      h: bRect.height

    var from = pill._rect || (key ? railPrevRect[key] : null);

    if (pill._anim) {
      try { pill._anim.cancel(); } catch (_e) {}
      pill._anim = null;
    }

    pill.style.width = to.w + 'px';
    pill.style.height = to.h + 'px';
    pill.style.transform = 'translate3d(' + to.x + 'px, ' + to.y + 'px, 0)';
    pill._rect = to;

    if (!animate || !from || isReducedMotion() || typeof pill.animate !== 'function') return;
    var dx = to.x - from.x;
    var dy = to.y - from.y;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2 && Math.abs(to.w - from.w) < 2) return;

        width: from.w + 'px',
        height: from.h + 'px'

        transform: 'translate3d(' + midX + 'px, ' + midY + 'px, 0) scaleY(0.9)',

        height: to.h + 'px',
        offset: 0.42

      {
        transform: 'translate3d(' + to.x + 'px, ' + to.y + 'px, 0) scaleY(1)',
        width: to.w + 'px',
        height: to.h + 'px'

      duration: 380,
      easing: 'cubic-bezier(0.22, 1.24, 0.36, 1)'

  }

  function renderNav(animate) {
    var items = navItems();

    var roleSig = state.sess && state.sess.isAdmin ? 'ADMIN' : 'USER';
    var dIn = $('deskNavIn'), bNav = $('botNav');

    // Keep nav DOM persistent so the liquid glass capsule glides smoothly between tabs
    if (navBuiltForRole !== roleSig) {
      navBuiltForRole = roleSig;
      dIn.innerHTML = ''; bNav.innerHTML = '';
      items.forEach(function (it) {
        var db = el('button');
        db.type = 'button';
        db.setAttribute('data-nav-key', it.key);

        mb.type = 'button';
        mb.setAttribute('data-nav-key', it.key);
        mb.appendChild(icon(it.ic, 19));
        mb.appendChild(el('span', '', it.label));
        mb.addEventListener('click', function () { goTab(it.key); });

      });
    }

    [dIn, bNav].forEach(function (rail) {
      [].forEach.call(rail.querySelectorAll('button[data-nav-key]'), function (b) {

  function goTab(key) {
    showMsg('');
    var prevTab = state.tab;
    if (prevTab === 'devices' && key !== 'devices') {
      stopPresenceAutoRefresh();
      destroyPresenceMapInstance();
    }
    var prevIdx = navIndexOf(prevTab);
    var nextIdx = navIndexOf(key);
    var dir = prevTab === key ? 0 : (nextIdx > prevIdx ? 1 : -1);
    state.tab = key;
    document.body.setAttribute('data-tab', key);
    renderNav(prevTab !== key);
    playWaterFlow(dir);
    if (key === 'overview') loadOverview();
    else if (key === 'devices') loadPresence(false);
    else if (key === 'tasks') loadMyTasks();
    else if (key === 'issues') loadIssues();
    else if (key === 'scores') loadScores();

  function filterOverviewPlans(data) {
    var q = state.ovSearch.trim().toLowerCase();
    return (data.plans || []).filter(function (p) {
      if (state.ovFilter === 'ONSITE' && p.kind !== 'ONSITE') return false;
      if (state.ovFilter === 'REMOTE' && p.kind !== 'REMOTE') return false;
      if (state.ovFilter === 'overdue' && !(p.overdue || p.status === 'missing')) return false;
      if (q) {
        var hay = (p.site_code + ' ' + p.site_name + ' ' + p.owner + ' ' + (p.owner_name || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

      [1, 2, 3, 4].forEach(function (w) {

            : '';
          pill.title = p.site_code + ' ' + p.kind + ' · นัด ' + thaiDate(p.due_date) + ' · ' + (p.owner_name || p.owner) + ' · ' + st.text + spTitle;
          pill.appendChild(el('span', '', st.short));
          pill.appendChild(el('span', 'k', p.kind === 'ONSITE' ? 'ON' : 'RM'));
          if (spInfo && spInfo.total > 0) {
            pill.appendChild(el('span', 'k', (data.collector_ok ? spInfo.online : '-') + '/' + spInfo.total));
          }
          pill.addEventListener('click', function () {
            if (p.cancelled) {
              showMsg('แผนนี้ถูกยกเลิกแล้ว: ' + (p.cancel_reason || '-'), 'warn');
              return;
            }
            openVisit(p.id);
          });
          td.appendChild(pill);
        });
        tr.appendChild(td);
      });
      // Who to chase: owners of this site's live plans this month, helpers below in muted text.
      var owners = [], helpers = [];
      [1, 2, 3, 4].forEach(function (w) {
        row.weeks[w].forEach(function (p) {
          if (p.cancelled) return;
          var on = p.owner_name || nameOf[p.owner] || p.owner;
          if (on && owners.indexOf(on) === -1) owners.push(on);
          (p.helpers || []).forEach(function (h) {

      if (helpers.length) tdOwn.appendChild(el('span', 'own-help', 'ผู้ช่วย: ' + helpers.join(', ')));
      if (!owners.length) tdOwn.appendChild(el('span', 'own-help', '-'));
      tr.appendChild(tdOwn);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    host.appendChild(wrap);

  function defaultDateForWeek(monthYm, weekNum) {
    var dayStr = weekNum === 1 ? '04' : weekNum === 2 ? '11' : weekNum === 3 ? '18' : '25';
    return monthYm + '-' + dayStr;

      [s2.code, 'REMOTE', '15/02/' + (y + 543), o2.owner, '', '', 'ตัวอย่าง']

      ['D owner', 'username ผู้รับผิดชอบหลัก ตามชีต "ผู้รับผิดชอบ"', 'ต้องมี'],

      ['F helpers', 'username ผู้ช่วย คั่นด้วย , หรือ ;', 'ไม่บังคับ'],
      ['G หมายเหตุ', 'ใส่คำว่า ตัวอย่าง = ระบบข้ามแถวนั้น (แถว 2-3 ไม่ถูกนำเข้า)', 'ไม่บังคับ'],
      ['', '', ''],

    ];

    var ownerRows = [['owner', 'owner_name']].concat(owners.map(function (o) { return [o.owner, o.owner_name]; }));
    exportXlsx('IT-MA-plan-template.xlsx', [

    ]);

  function collectKnownOwners(data) {
    if (Array.isArray(data.owners) && data.owners.length > 0) {
      return data.owners.map(function (o) {
        var u = String(o.owner || '').toLowerCase();
        return { owner: u, owner_name: o.owner_name || u };
      });
    }
    var map = {};
    (data.plans || []).forEach(function (p) {
      if (p && p.owner) {
        var u = String(p.owner).toLowerCase();
        if (!map[u] || map[u] === u) map[u] = p.owner_name || p.owner;
      }
    });
    return Object.keys(map).sort().map(function (u) {
      return { owner: u, owner_name: map[u] };
    });
  }

      [

        columns.push(colObj);
        colMap[o.owner] = colObj;
      });
      filteredPlans.forEach(function (p) {
        var u = String(p.owner || '').toLowerCase();
        if (!colMap[u]) {
          var colObj = { key: u, owner: u, owner_name: p.owner_name || u, title: (p.owner_name || u) + ' (' + u + ')', items: [] };
          columns.push(colObj);
          colMap[u] = colObj;

          e.preventDefault();

          var pid = Number(rawId);

          if (!isWeekMode && String(plan.owner || '').toLowerCase() === col.key) return;

          ih.appendChild(el('span', 'badge ' + st.badge, st.text));
          card.appendChild(ih);

          var meta = el('div', 'item-meta');
          meta.appendChild(el('span', '', 'นัด: ' + thaiDate(p.due_date) + ' (W' + p.week + ')'));

            meta.appendChild(el('span', '', 'เดิม: ' + thaiDate(p.original_due_date)));
          }
          meta.appendChild(el('span', '', 'ผู้รับผิดชอบ: ' + (p.owner_name || p.owner)));

      board.appendChild(colEl);

  // ---------------- Screen 3: Visit Workspace (Mobile Speed-First) ----------------
  function openVisit(planId) {
    showMsg('');
    var entering = state.tab !== 'visit';
    state.tab = 'visit';
    state.visitPlanId = planId;
    document.body.setAttribute('data-tab', 'visit');
    renderNav(entering);
    if (entering) playWaterFlow(0);
    var seq = ++state.navSeq;
    var v = $('view');
    v.setAttribute('aria-busy', 'true');
    v.innerHTML = '<div class="card">กำลังเปิดใบงาน...</div>';
    api('visit_open', { plan_id: planId }).then(function (data) {
      if (seq !== state.navSeq) return;
      state.visitData = data;
      // Restore pending offline answers on top of server answers
      var q = getQueue(data.visit.id);
      Object.values(q).forEach(function (item) {
        mergeAnswerIntoVisit({
          visit_device_id: item.visit_device_id || null,
          scope_key: item.visit_device_id ? 'dev:' + item.visit_device_id : 'site',
          template_item_id: item.template_item_id,
          item_key: 'tpl:' + item.template_item_id,
          result: item.result,
          value_text: item.value_text || '',
          note: item.note || '',
          photo_paths: item.photo_paths || []
        });
      });
      if (!state.visitSubTab || !subTabExists(state.visitSubTab)) {
        state.visitSubTab = data.visit_devices.length ? 'dev:' + data.visit_devices[0].id : 'site';
      }
      v.removeAttribute('aria-busy');
      renderVisitView();
    }).catch(function (e) {
      if (seq !== state.navSeq) return;
      v.removeAttribute('aria-busy');
      showMsg(e.message, 'err');
    });
  }

  function subTabExists(k) {
    if (k === 'site' || k === 'page2') return true;
    if (k.indexOf('dev:') === 0 && state.visitData) {
      var id = Number(k.slice(4));
      return state.visitData.visit_devices.some(function (d) { return d.id === id; });
    }
    return false;
  }

  function mergeAnswerIntoVisit(ans) {
    if (!state.visitData || !ans) return;
    var list = state.visitData.answers;
    var idx = list.findIndex(function (x) {
      return x.scope_key === ans.scope_key && Number(x.template_item_id) === Number(ans.template_item_id);
    });
    if (idx === -1) list.push(ans);
    else list[idx] = Object.assign({}, list[idx], ans);
  }

  function computeLocalProgress() {
    var d = state.visitData;
    var ansSet = {};
    d.answers.forEach(function (a) { ansSet[a.scope_key + '|tpl:' + a.template_item_id] = a; });
    var total = 0, answered = 0;
    d.visit_devices.forEach(function (dev) {
      d.template_items.forEach(function (it) {
        if (it.is_site_level || !it.active) return;
        if ((it.applies_to || []).indexOf(dev.role) === -1) return;
        total++;
        if (ansSet['dev:' + dev.id + '|tpl:' + it.id]) answered++;
      });
    });
    if (d.plan.kind === 'ONSITE') {
      d.template_items.forEach(function (it) {
        if (!it.is_site_level || !it.active) return;
        total++;
        if (ansSet['site|tpl:' + it.id]) answered++;
      });
    }
    return { total: total, answered: answered, ansMap: ansSet };
  }

    var topRow = el('div', 'visit-top-row');
    var titleWrap = el('div');
    var backRow = el('div', 'row-actions no-print');
    backRow.style.marginTop = '0';
    backRow.style.marginBottom = '4px';
    backRow.appendChild(btn('กลับ', 'sm', function () { goTab('overview'); }, 'arrowLeft'));
    backRow.appendChild(el('span', 'badge ' + st.badge, st.text));
    backRow.appendChild(el('span', 'badge brand', d.plan.kind));
    var reopened = d.visit.status === 'draft' && Number(d.visit.reopen_count || 0) > 0;
    if (reopened) backRow.appendChild(el('span', 'badge warn', 'เปิดแก้ไข ครั้งที่ ' + d.visit.reopen_count));
    titleWrap.appendChild(backRow);
    titleWrap.appendChild(el('h2', 'page-title', d.site.code + ' ' + d.site.name));
    var opNames = Object.values(d.visit.operator_names || {}).join(', ');
    titleWrap.appendChild(el('p', 'page-sub', 'นัดตรวจ ' + thaiDate(d.plan.due_date) + (opNames ? ' · ผู้ปฏิบัติงาน: ' + opNames : '')));
    if (d.visit.status === 'submitted' && d.visit.submitted_at) {
      titleWrap.appendChild(el('p', 'page-sub', 'ส่งเมื่อ ' + bkkDateTime(d.visit.submitted_at) +
        (d.visit.submitted_by_name ? ' โดย ' + d.visit.submitted_by_name : '') +
        (d.visit.first_submitted_at && d.visit.first_submitted_at !== d.visit.submitted_at ? ' · ส่งครั้งแรก ' + bkkDateTime(d.visit.first_submitted_at) + ' (คะแนนคิดจากเวลานี้)' : '')));
    } else if (reopened && d.visit.first_submitted_at) {
      titleWrap.appendChild(el('p', 'page-sub', 'ส่งครั้งแรก ' + bkkDateTime(d.visit.first_submitted_at) + ' · คะแนนคิดจากเวลานี้ แก้แล้วกดส่งใบงานอีกครั้ง'));
    }
    topRow.appendChild(titleWrap);

    var actions = el('div', 'row-actions no-print');
    actions.appendChild(btn('พิมพ์ใบงาน', 'sm', function () { window.print(); }, 'printer'));
    if (!locked) {
      actions.appendChild(btn('ส่งใบงาน', 'primary sm', submitCurrentVisit, 'check'));
    } else if (d.visit.status === 'submitted' && !d.plan.cancelled && canRequestReopen(d)) {
      actions.appendChild(btn('ขอเปิดแก้ไข', 'sm', function () { openReopenModal(d); }, 'refresh'));
    }
    topRow.appendChild(actions);
    sticky.appendChild(topRow);

    // Progress + Offline Sync Indicator
    var progRow = el('div', 'visit-top-row');
    progRow.appendChild(el('span', 'page-sub', 'ตอบแล้ว ' + prog.answered + ' / ' + prog.total + ' ข้อ (' + d.visit_devices.length + ' เครื่อง)'));
    if (qCnt > 0) {
      var offBtn = btn('ยังไม่ได้ส่งขึ้น ' + qCnt + ' ข้อ (กดส่ง)', 'danger sm', function () {
        flushOfflineQueue(d.visit.id).then(function (n) {
          showMsg('ส่งคำตอบค้าง ' + n + ' ข้อสำเร็จแล้ว', 'ok');
          renderVisitView();
        }).catch(function () {
          showMsg('ยังไม่สามารถเชื่อมต่อได้ คำตอบยังถูกเก็บไว้ในเครื่อง', 'warn');
        });
      }, 'wifiOff');
      progRow.appendChild(offBtn);
    }
    sticky.appendChild(progRow);

    var pBar = el('div', 'kpi-bar');
    var pFill = el('span');
    pFill.style.width = (prog.total > 0 ? Math.round((prog.answered / prog.total) * 100) : 0) + '%';
    pBar.appendChild(pFill);
    sticky.appendChild(pBar);

    // Device & Section Tabs
    var tabs = el('div', 'dev-tabs no-print');
    tabs.setAttribute('role', 'tablist');
    d.visit_devices.forEach(function (dev) {
      var tb = el('button', 'dev-tab');
      tb.type = 'button';
      tb.setAttribute('role', 'tab');
      var k = 'dev:' + dev.id;
      tb.setAttribute('aria-selected', state.visitSubTab === k ? 'true' : 'false');
      if (dev.presence) {
        var dotCls = !d.collector_ok ? 'unknown' : (dev.presence.online ? 'online' : 'offline');
        var dot = el('span', 'p-dot ' + dotCls);
        dot.style.marginRight = '6px';
        tb.appendChild(dot);
      }
      tb.appendChild(el('span', '', dev.computer_name + ' (' + dev.role + ')'));
      tb.addEventListener('click', function () { state.visitSubTab = k; renderVisitView(); });
      tabs.appendChild(tb);
    });
    if (!locked) {
      var addBtn = el('button', 'dev-tab');
      addBtn.type = 'button';
      addBtn.appendChild(icon('plus', 14));
      addBtn.appendChild(el('span', '', 'เพิ่มเครื่อง'));
      addBtn.addEventListener('click', openAddDeviceModal);
      tabs.appendChild(addBtn);
    }
    var siteTab = el('button', 'dev-tab', 'ระดับสาขา');
    siteTab.type = 'button';
    siteTab.setAttribute('role', 'tab');
    siteTab.setAttribute('aria-selected', state.visitSubTab === 'site' ? 'true' : 'false');
    siteTab.addEventListener('click', function () { state.visitSubTab = 'site'; renderVisitView(); });
    tabs.appendChild(siteTab);

    var p2Tab = el('button', 'dev-tab', 'ข้อมูลหน้า 2 / ความเห็น');
    p2Tab.type = 'button';
    p2Tab.setAttribute('role', 'tab');
    p2Tab.setAttribute('aria-selected', state.visitSubTab === 'page2' ? 'true' : 'false');
    p2Tab.addEventListener('click', function () { state.visitSubTab = 'page2'; renderVisitView(); });
    tabs.appendChild(p2Tab);
    sticky.appendChild(tabs);
    v.appendChild(sticky);

    // Open Issues Banner for this site (can close directly inside visit!)
    if (d.open_issues && d.open_issues.length) {
      var issCard = el('div', 'card no-print');
      issCard.style.marginBottom = '12px';
      var ih = el('div', 'item-head');
      ih.appendChild(el('strong', '', 'ปัญหาค้างของสาขานี้ (' + d.open_issues.length + ' รายการ)'));
      issCard.appendChild(ih);
      d.open_issues.forEach(function (iss) {
        var row = el('div', 'suggest-box');
        row.style.marginTop = '8px';
        row.style.background = 'var(--c-warn-soft)';
        row.style.borderColor = 'var(--c-warn-line)';
        row.style.color = 'var(--c-warn)';
        row.appendChild(el('span', '', (iss.device_name ? '[' + iss.device_name + '] ' : '[ระดับสาขา] ') + iss.item_label + (iss.note ? ' — ' + iss.note : '')));
        row.appendChild(btn('ปิดปัญหา', 'sm', function () { openCloseIssueModal(iss, d.visit.id, function () { openVisit(d.plan.id); }); }));
        issCard.appendChild(row);
      });
      v.appendChild(issCard);
    }

    // Main sub-tab content
    if (state.visitSubTab === 'page2') {
      renderVisitPage2(v, locked);
    } else if (state.visitSubTab === 'site') {
      var siteItems = d.template_items.filter(function (i) { return i.is_site_level && i.active; });
      if (!siteItems.length) {
        v.appendChild(el('div', 'card', 'ไม่มีหัวข้อระดับสาขาสำหรับแม่แบบนี้'));
      } else {
        renderChecklistSections(v, siteItems, null, prog.ansMap, locked);
      }
    } else if (state.visitSubTab.indexOf('dev:') === 0) {
      var devId = Number(state.visitSubTab.slice(4));
      var dev = d.visit_devices.find(function (x) { return x.id === devId; });
      if (!dev) {
        var emp = el('div', 'empty-state');
        emp.appendChild(el('h2', '', 'ยังไม่ได้เพิ่มเครื่องคอมพิวเตอร์ในใบงาน'));
        emp.appendChild(el('p', '', 'กด "เพิ่มเครื่อง" ด้านบนเพื่อเลือกจากเครื่องเดิมของสาขา หรือกรอกข้อมูลเครื่องใหม่'));
        if (!locked) emp.appendChild(btn('เพิ่มเครื่องแรก', 'primary', openAddDeviceModal, 'plus'));
        v.appendChild(emp);
        return;
      }
      // Device spec summary card
      var dCard = el('div', 'card');
      dCard.style.marginBottom = '12px';
      var dh = el('div', 'item-head');
      var dl = el('div');
      var dTitleRow = el('div', 'row-actions');
      dTitleRow.style.marginTop = '0';
      dTitleRow.appendChild(el('h3', 'item-title', dev.computer_name + ' (' + (ROLE_LABELS[dev.role] || dev.role) + ')'));
      if (dev.presence) {
        var prBadgeCls = !d.collector_ok ? 'warn' : (dev.presence.online ? 'ok' : 'muted');
        var prBadgeTxt = !d.collector_ok
          ? 'ไม่มีข้อมูลตัวรับ'
          : (dev.presence.online ? 'ออนไลน์ตอนนี้' : 'ไม่เห็น ' + thaiRelativeTime(dev.presence.last_seen));
        dTitleRow.appendChild(el('span', 'badge ' + prBadgeCls, prBadgeTxt));
      } else {
        dTitleRow.appendChild(el('span', 'badge muted', 'ยังไม่ผูก MAC ไฟร์วอลล์'));
      }
      dl.appendChild(dTitleRow);
      var specs = [dev.model, dev.cpu, dev.ram ? 'RAM ' + dev.ram : '', dev.windows_version, dev.ip ? 'IP ' + dev.ip : '', dev.fixed_asset_no ? 'FA ' + dev.fixed_asset_no : ''].filter(Boolean).join(' · ');
      dl.appendChild(el('p', 'page-sub', specs || 'ยังไม่ได้ระบุสเปกเครื่อง'));
      dh.appendChild(dl);
      if (!locked) {
        var da = el('div', 'row-actions no-print');
        da.appendChild(btn('แก้ข้อมูลเครื่อง', 'sm', function () { openEditDeviceModal(dev); }));
        da.appendChild(btn('นำออก', 'danger sm', function () {
          if (!confirm('นำเครื่อง ' + dev.computer_name + ' ออกจากใบงานนี้หรือไม่')) return;
          api('visit_remove_device', { visit_device_id: dev.id }).then(function () {
            state.visitSubTab = '';
            openVisit(d.plan.id);
          }).catch(function (e) { showMsg(e.message, 'err'); });
        }));
        dh.appendChild(da);
      }
      dCard.appendChild(dh);
      v.appendChild(dCard);

      var devItems = d.template_items.filter(function (i) {
        return !i.is_site_level && i.active && (i.applies_to || []).indexOf(dev.role) !== -1;
      });
      renderChecklistSections(v, devItems, dev, prog.ansMap, locked);
    } else {
      var emp0 = el('div', 'empty-state');
      emp0.appendChild(el('h2', '', 'เริ่มต้นตรวจเช็คด้วยการเพิ่มเครื่อง'));
      emp0.appendChild(el('p', '', 'ใบงานต้องมีอย่างน้อย 1 เครื่อง และตอบครบทุกหัวข้อตามประเภทเครื่อง'));
      if (!locked) emp0.appendChild(btn('เพิ่มเครื่องคอมพิวเตอร์', 'primary', openAddDeviceModal, 'plus'));
      v.appendChild(emp0);
    }
  }

  function renderChecklistSections(host, items, dev, ansMap, locked) {
    var d = state.visitData;
    var scopeKey = dev ? 'dev:' + dev.id : 'site';
    var secOrder = [];
    var bySec = {};
    items.forEach(function (it) {
      if (!bySec[it.section]) { bySec[it.section] = []; secOrder.push(it.section); }
      bySec[it.section].push(it);
    });

    secOrder.forEach(function (secName) {
      var secItems = bySec[secName];
      var secCard = el('div', 'sec-card');
      var sh = el('div', 'sec-head');
      var secDone = secItems.filter(function (it) { return ansMap[scopeKey + '|tpl:' + it.id]; }).length;
      var h3 = el('h3', '', secName + ' ');
      h3.appendChild(el('span', 'sec-count', secDone + '/' + secItems.length));
      sh.appendChild(h3);

      if (!locked) {
        sh.appendChild(btn('ปกติทั้งหมด', 'ok sm no-print', function () {
          var bulk = [];
          secItems.forEach(function (it) {
            var cur = ansMap[scopeKey + '|tpl:' + it.id];
            if (!cur) {
              bulk.push({
                visit_device_id: dev ? dev.id : undefined,
                template_item_id: it.id,
                result: 'ok',
                value_text: '',
                note: '',
                photo_paths: []
              });
            }
          });
          if (!bulk.length) { showMsg('หมวดนี้ตอบครบทุกข้อแล้ว', 'ok'); return; }
          // Optimistic UI update immediately for mobile speed
          bulk.forEach(function (b) {
            mergeAnswerIntoVisit({
              visit_device_id: dev ? dev.id : null,
              scope_key: scopeKey,
              template_item_id: b.template_item_id,
              item_key: 'tpl:' + b.template_item_id,
              result: 'ok',
              value_text: '',
              note: '',
              photo_paths: []
            });
          });
          renderVisitView();
          api('visit_save_answers_bulk', { visit_id: d.visit.id, items: bulk }).then(function (res) {
            (res.answers || []).forEach(mergeAnswerIntoVisit);
            if (res.suggested_close_issues && res.suggested_close_issues.length) {
              showMsg('พบปัญหาเดิมที่ค้างอยู่ ' + res.suggested_close_issues.length + ' ข้อ สามารถกดปิดได้ที่แถบด้านบน', 'ok');
            }
            renderVisitView();
          }).catch(function (e) {
            if (e.offline) {
              bulk.forEach(function (b) { queueAnswer(d.visit.id, b); });
              showMsg('ออฟไลน์: เก็บร่างไว้ในเครื่องแล้ว ' + queueCount(d.visit.id) + ' ข้อ', 'warn');
              renderVisitView();
            } else {
              showMsg(e.message, 'err');
            }
          });
        }, 'check'));
      }
      secCard.appendChild(sh);

      secItems.forEach(function (it, idx) {
        var ansKey = scopeKey + '|tpl:' + it.id;
        var cur = ansMap[ansKey] || null;
        var row = el('div', 'chk-item' + (cur && cur.result === 'abnormal' ? ' is-abnormal' : ''));
        row.id = 'chk-' + scopeKey.replace(':', '-') + '-' + it.id;
        // Number + title like the paper form's ลำดับ column; on wide screens the row becomes title | switch | note.
        var title = el('div', 'chk-title');
        title.appendChild(el('span', 'chk-num', String(idx + 1)));
        title.appendChild(el('div', 'chk-label', it.label));
        row.appendChild(title);

        // 3 large tap buttons: ปกติ / ไม่ปกติ / ไม่เกี่ยว
        var btns = el('div', 'chk-btns');
        var saveAns = function (nextResult, nextVal, nextNote, nextPhotos) {
          var payload = {
            visit_device_id: dev ? dev.id : undefined,
            template_item_id: it.id,
            result: nextResult,
            value_text: nextVal !== undefined ? nextVal : (cur ? cur.value_text || '' : ''),
            note: nextNote !== undefined ? nextNote : (cur ? cur.note || '' : ''),
            photo_paths: nextPhotos !== undefined ? nextPhotos : (cur ? cur.photo_paths || [] : [])
          };
          mergeAnswerIntoVisit({
            visit_device_id: dev ? dev.id : null,
            scope_key: scopeKey,
            template_item_id: it.id,
            item_key: 'tpl:' + it.id,
            result: payload.result,
            value_text: payload.value_text,
            note: payload.note,
            photo_paths: payload.photo_paths
          });
          renderVisitView();
          api('visit_save_answer', Object.assign({ visit_id: d.visit.id }, payload)).then(function (res) {
            if (res.answer) mergeAnswerIntoVisit(res.answer);
            if (res.suggested_close_issues && res.suggested_close_issues.length) {
              d._suggested = d._suggested || {};
              d._suggested[scopeKey + '|tpl:' + it.id] = res.suggested_close_issues;
            }
            renderVisitView();
          }).catch(function (e) {
            if (e.offline) {
              queueAnswer(d.visit.id, payload);
              showMsg('ออฟไลน์: เก็บร่างไว้ในเครื่องแล้ว ' + queueCount(d.visit.id) + ' ข้อ', 'warn');
              renderVisitView();
            } else {
              showMsg(e.message, 'err');
            }
          });
        };

        [['ok', 'ปกติ', 'check'], ['abnormal', 'ไม่ปกติ', 'alert'], ['na', 'ไม่เกี่ยว', 'minus']].forEach(function (opt) {
          var b = el('button', 'chk-btn');
          b.type = 'button';
          b.setAttribute('data-val', opt[0]);
          b.setAttribute('aria-pressed', cur && cur.result === opt[0] ? 'true' : 'false');
          b.disabled = locked;
          b.appendChild(icon(opt[2], 15));
          b.appendChild(el('span', '', opt[1]));
          b.addEventListener('click', function () {
            // A note typed before any result was picked is saved together with the first result.
            var draft = !cur && d._noteDraft && d._noteDraft[ansKey];
            if (draft) delete d._noteDraft[ansKey];
            saveAns(opt[0], undefined, draft || undefined);
          });
          btns.appendChild(b);
        });
        row.appendChild(btns);

        // Optional value input for number / text items
        if (it.answer_type === 'number' || it.answer_type === 'text') {
          var vInp = el('input', 'input');
          vInp.type = it.answer_type === 'number' ? 'number' : 'text';
          vInp.placeholder = it.answer_type === 'number' ? 'ระบุตัวเลข...' : 'ระบุค่า / รายละเอียดเพิ่มเติม...';
          vInp.value = cur ? (cur.value_text || '') : '';
          vInp.disabled = locked;
          vInp.addEventListener('change', function () {
            saveAns(cur ? cur.result : 'ok', vInp.value);
          });
          row.appendChild(vInp);
        }

        // Note & photos: always open when abnormal or already filled; otherwise the user opens it
        // with the "หมายเหตุ" toggle (paper form has a หมายเหตุ/การแก้ไข column on every row).
        d._noteOpen = d._noteOpen || {};
        d._noteDraft = d._noteDraft || {};
        var hasContent = !!(cur && (cur.note || (cur.photo_paths && cur.photo_paths.length)));
        var forcedOpen = !!(cur && cur.result === 'abnormal') || hasContent;
        var showExtra = forcedOpen || (!locked && d._noteOpen[ansKey]);
        if (!forcedOpen && !locked) {
          var tg = el('button', 'note-toggle no-print', d._noteOpen[ansKey] ? '− ซ่อนหมายเหตุ' : '+ หมายเหตุ');
          tg.type = 'button';
          tg.setAttribute('aria-expanded', d._noteOpen[ansKey] ? 'true' : 'false');
          tg.addEventListener('click', function () {
            d._noteOpen[ansKey] = !d._noteOpen[ansKey];
            renderVisitView();
            var inp = document.getElementById('note-' + row.id);
            if (d._noteOpen[ansKey] && inp) inp.focus();
          });
          row.appendChild(tg);
        }
        if (showExtra) {
          var extra = el('div', 'chk-extra');
          var noteInp = el('input', 'input');
          noteInp.type = 'text';
          noteInp.id = 'note-' + row.id;
          noteInp.setAttribute('aria-label', 'หมายเหตุ / การแก้ไข: ' + it.label);
          noteInp.placeholder = cur && cur.result === 'abnormal'
            ? 'บันทึกอาการผิดปกติ / หมายเหตุการแก้ไข...'
            : 'หมายเหตุ / การแก้ไข...';
          noteInp.value = cur ? (cur.note || '') : (d._noteDraft[ansKey] || '');
          noteInp.disabled = locked;
          noteInp.addEventListener('change', function () {
            if (cur) saveAns(cur.result, cur.value_text, noteInp.value);
            else d._noteDraft[ansKey] = noteInp.value;
          });
          extra.appendChild(noteInp);
          if (!cur) extra.appendChild(el('div', 'page-sub', 'เลือก ปกติ / ไม่ปกติ / ไม่เกี่ยว แล้วหมายเหตุจะบันทึกพร้อมกัน'));

          var pRow = el('div', 'photo-row');
          ((cur && cur.photo_paths) || []).forEach(function (p) {
            var url = (d.photo_urls || {})[p];
            if (url) {
              var a = document.createElement('a');
              a.href = url; a.target = '_blank'; a.rel = 'noopener';
              var img = el('img', 'photo-thumb');
              img.src = url; img.alt = 'รูปประกอบการตรวจเช็ค';
              a.appendChild(img);
              pRow.appendChild(a);
            } else if (String(p).indexOf('drive:') === 0) {
              pRow.appendChild(el('span', 'badge muted', 'รูปเก็บที่ Google Drive แล้ว'));
            }
          });
          if (!locked && cur) {
            var fi = document.createElement('input');
            fi.type = 'file'; fi.accept = 'image/*'; fi.capture = 'environment'; fi.hidden = true;
            fi.addEventListener('change', function () {
              if (!fi.files[0]) return;
              showMsg('กำลังย่อและอัปโหลดรูป...');
              resizePhoto(fi.files[0], 1280, 0.78).then(function (rz) {
                return api('visit_upload_photo', { visit_id: d.visit.id, mime: rz.mime, b64: rz.b64 });
              }).then(function (up) {
                d.photo_urls = d.photo_urls || {};
                d.photo_urls[up.path] = up.signed_url;
                var nextPaths = (cur.photo_paths || []).concat([up.path]);
                showMsg('แนบรูปเรียบร้อยแล้ว', 'ok');
                saveAns(cur.result, cur.value_text, cur.note, nextPaths);
              }).catch(function (e) { showMsg(e.message, 'err'); });
              fi.value = '';
            });
            extra.appendChild(fi);
            pRow.appendChild(btn('แนบรูป', 'sm no-print', function () { fi.click(); }, 'camera'));
          }
          extra.appendChild(pRow);
          row.appendChild(extra);
        }

        // Suggested close banner if marking 'ok' resolved a previous open issue
        var sugg = (d._suggested || {})[scopeKey + '|tpl:' + it.id];
        if (sugg && sugg.length && cur && cur.result === 'ok') {
          sugg.forEach(function (iss) {
            var sb = el('div', 'suggest-box');
            sb.appendChild(el('span', '', 'ข้อนี้เคยค้างปัญหาเดิม: "' + (iss.note || iss.item_label) + '" ต้องการปิดปัญหาเดิมหรือไม่'));
            sb.appendChild(btn('ปิดปัญหาเดิม', 'ok sm', function () {
              openCloseIssueModal(iss, d.visit.id, function () {
                delete d._suggested[scopeKey + '|tpl:' + it.id];
                openVisit(d.plan.id);
              });
            }));
            row.appendChild(sb);
          });
        }

        secCard.appendChild(row);
      });
      host.appendChild(secCard);
    });
  }

  function renderVisitPage2(host, locked) {
    var d = state.visitData;
    var info = d.visit.site_info || {};
    var card = el('div', 'card');

  function submitCurrentVisit() {
    var d = state.visitData;
    var qCnt = queueCount(d.visit.id);
    var prep = qCnt > 0 ? flushOfflineQueue(d.visit.id) : Promise.resolve(0);
    prep.then(function () {
      return api('visit_submit', { visit_id: d.visit.id });
    }).then(function (res) {
      var warn = (res.completion && res.completion.unchecked_active_devices || []);
      var extra = warn.length ? ' (หมายเหตุ: ยังไม่ได้ตรวจ ' + warn.map(function (x) { return x.computer_name; }).join(', ') + ')' : '';
      showMsg('ส่งใบงานเรียบร้อยแล้ว — สถานะ: ' + statusInfo(res.plan_eval).text + extra, 'ok');
      openVisit(d.plan.id);
    }).catch(function (e) {
      if (e.code === 'incomplete_visit' && e.data && e.data.completion) {
        var c = e.data.completion;
        if (c.missing_device_requirement) {
          showMsg('กรุณาเพิ่มเครื่องคอมพิวเตอร์อย่างน้อย 1 เครื่องก่อนส่งใบงาน', 'err');
        } else if (c.missing_items && c.missing_items.length) {
          var first = c.missing_items[0];
          showMsg('ยังตอบไม่ครบ ' + c.missing_items.length + ' ข้อ (เช่น ' + first.device_name + ': ' + first.label + ')', 'err');
          state.visitSubTab = first.scope_key;
          renderVisitView();
          var target = document.getElementById('chk-' + first.scope_key.replace(':', '-') + '-' + first.template_item_id);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      } else {
        showMsg(e.message, 'err');
      }
    });
  }

      it.appendChild(el('h3', 'item-title', iss.item_label));

  // ---------------- Plan board (ตารางคุมแผน): one row per site, W1-W4 per month, like the paper/Excel sheet ----------------
  var BOARD_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  // Visits per year (from settings) -> period length in months; period index 0..freq-1.
  function boardPeriods(freq) {
    var len = 12 / freq, out = [];
    for (var i = 0; i < freq; i++) {
      var m0 = i * len + 1, m1 = m0 + len - 1;
      var range = BOARD_MONTHS[m0 - 1] + (len > 1 ? '–' + BOARD_MONTHS[m1 - 1] : '');
      var name = freq === 1 ? 'ทั้งปี' : freq === 2 ? (i === 0 ? 'ครึ่งปีแรก' : 'ครึ่งปีหลัง') : freq === 4 ? 'ไตรมาส ' + (i + 1) : 'รอบ ' + (i + 1);
      out.push({ idx: i, m0: m0, m1: m1, label: name + (freq === 1 ? '' : ' (' + range + ')') });
    }
    return out;
  }

  function weekOfIso(iso) {
    var d = Number(String(iso).slice(8, 10));
    return d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4;
  }

  function buildBoard(data, kind, period) {
    var nameOf = {};
    (data.owners || []).forEach(function (o) { nameOf[o.owner] = o.owner_name || o.owner; });
    var inPeriod = function (iso) { var m = Number(String(iso || '').slice(5, 7)); return m >= period.m0 && m <= period.m1; };
    var plans = data.plans.filter(function (p) {
      return p.kind === kind && !p.cancelled && (inPeriod(p.due_date) || inPeriod(p.original_due_date));
    });
    var bySite = {};
    plans.forEach(function (p) { (bySite[p.site_id] = bySite[p.site_id] || []).push(p); });
    var rows = data.sites.filter(function (s) { return s.active !== false || bySite[s.id]; }).map(function (s) {
      var ps = (bySite[s.id] || []).slice().sort(function (a, b) { return a.due_date.localeCompare(b.due_date); });
      var people = [];
      ps.forEach(function (p) {
        [p.owner].concat(p.helpers || []).forEach(function (u) {
          var n = (u === p.owner && p.owner_name) || nameOf[u] || u;
          n = String(n).trim().split(/\s+/)[0];
          if (n && people.indexOf(n) === -1) people.push(n);
        });
      });
      return { site: s, plans: ps, people: people.join('/'), first: ps[0] || null };
    });
    rows.sort(function (a, b) {
      if (!a.first !== !b.first) return a.first ? -1 : 1;
      if (a.first && b.first && a.first.due_date !== b.first.due_date) return a.first.due_date.localeCompare(b.first.due_date);
      return String(a.site.code).localeCompare(String(b.site.code));
    });
    var weekCount = {};
    plans.forEach(function (p) {
      var k = Number(p.due_date.slice(5, 7)) + '-' + p.week;
      weekCount[k] = (weekCount[k] || 0) + 1;
    });
    return { rows: rows, weekCount: weekCount };
  }

  // Cell text + class for one plan at its due week: check mark on time, -2/-10 penalty, else the planned day.
  function boardCell(p) {
    var st = statusInfo(p);
    if (p.status === 'submitted') return { text: '✓', cls: 'bc-ok', title: st.text };
    if (p.status === 'late' || p.status === 'missing') return { text: st.short, cls: 'bc-bad', title: st.text };
    return { text: String(Number(p.due_date.slice(8, 10))), cls: p.status === 'in_progress' ? 'bc-doing' : 'bc-plan', title: st.text };
  }

  function boardStatus(row) {
    if (!row.first) return { text: 'ยังไม่ลงแผน', cls: 'err' };
    var st = statusInfo(row.first);
    return { text: st.text, cls: st.badge };
  }

  function boardNote(row) {
    return row.plans.map(function (p) {
      if (p.submitted_date) return 'ส่ง ' + p.submitted_date.slice(8, 10) + '/' + p.submitted_date.slice(5, 7) + '/' + p.submitted_date.slice(0, 4);
      if (p.rescheduled) return 'เลื่อนจาก ' + thaiDate(p.original_due_date);
      return '';
    }).filter(Boolean).join(' · ');
  }

  function boardSheetRows(b, kind, period, year) {
    var months = [];
    for (var m = period.m0; m <= period.m1; m++) months.push(m);
    var head1 = ['ลำดับ', 'Branch Code', 'ชื่อสาขา', 'ผู้รับผิดชอบ', 'สถานะ'], head2 = ['', '', '', '', ''];
    months.forEach(function (mm) { [1, 2, 3, 4].forEach(function (w) { head1.push(w === 1 ? BOARD_MONTHS[mm - 1] : ''); head2.push('W' + w); }); });
    head1.push('หมายเหตุ'); head2.push('');
    var rows = [['ตาราง ' + (kind === 'ONSITE' ? 'Onsite' : 'Remote') + ' Maintenance ปี ' + (year + 543) + ' ' + period.label], head1, head2];
    b.rows.forEach(function (r, i) {
      var line = [i + 1, r.site.code, r.site.name, r.people, boardStatus(r).text];
      months.forEach(function (mm) {
        [1, 2, 3, 4].forEach(function (w) {
          var ym = year + '-' + String(mm).padStart(2, '0');
          var p = r.plans.filter(function (x) { return x.due_date.slice(0, 7) === ym && x.week === w; })[0];
          line.push(p ? boardCell(p).text : '');
        });
      });
      line.push(boardNote(r));
      rows.push(line);
    });
    return rows;
  }

  // Whole year in one file: one sheet per kind x period (e.g. 4 sheets at 2 visits/year).
  function exportBoardYearXlsx(data) {
    var sheets = [];
    ['ONSITE', 'REMOTE'].forEach(function (kind) {

  function parseTimeSecClient(raw, fallbackSec) {
    var m = /^(\d{2}):(\d{2})(?::(\d{2}))?$/.exec(String(raw || '').trim());
    if (!m) return fallbackSec;
    var hh = Number(m[1]), mm = Number(m[2]), ss = m[3] ? Number(m[3]) : 0;
    if (hh > 23 || mm > 59 || ss > 59) return fallbackSec;
    return hh * 3600 + mm * 60 + ss;
  }

  // Same 4-case operating-hours logic as public.itm_in_open_hours / logic.ts inOpenHours.
  function inOpenHoursBkk(openTime, closeTime, closedDow, nowIso) {
    var ms = typeof nowIso === 'number' ? nowIso : Date.parse(String(nowIso || ''));
    if (!Number.isFinite(ms)) return false;
    var openSec = parseTimeSecClient(openTime, 8 * 3600);
    var closeSec = parseTimeSecClient(closeTime, 21 * 3600);
    var bkk = new Date(ms + 7 * 3600 * 1000);
    var timeSec = bkk.getUTCHours() * 3600 + bkk.getUTCMinutes() * 60 + bkk.getUTCSeconds();
    var inTime = false;
    var shiftMs = bkk.getTime();
    if (openSec === closeSec) {
      inTime = true;
    } else if (closeSec < openSec) {
      inTime = timeSec >= openSec || timeSec < closeSec;
      if (timeSec < closeSec) shiftMs -= 24 * 3600 * 1000;
    } else {
      inTime = timeSec >= openSec && timeSec < closeSec;
    }
    if (!inTime) return false;
    if (Array.isArray(closedDow) && closedDow.length > 0) {
      var dow = new Date(shiftMs).getUTCDay();
      for (var i = 0; i < closedDow.length; i++) {
        if (Number(closedDow[i]) === dow) return false;
      }
    }
    return true;
  }

  function computeFilteredSites(data) {
    var showRand = state.presenceRandomMac;
    var stFilter = state.presenceFilter; // 'all' | 'online' | 'offline'
    var q = state.presenceSearch.trim().toLowerCase();
    var collectorOk = Boolean(data.collector_ok);

    var totalOnline = 0;
    var totalDevices = 0;
    var silentBranches = 0;
    var outSites = [];

    (data.sites || []).forEach(function (s) {
      var visDevs = (s.devices || []).filter(function (d) {
        if (!showRand && d.random_mac) return false;
        return true;
      });
      var onlineCnt = 0;
      visDevs.forEach(function (d) { if (d.online) onlineCnt++; });
      var totalCnt = visDevs.length;

      totalOnline += onlineCnt;
      totalDevices += totalCnt;
      var inOpenHours = typeof s.in_open_hours === 'boolean'
        ? s.in_open_hours
        : (s.site_id ? inOpenHoursBkk(s.open_time, s.close_time, s.closed_dow, data.now) : true);
      var branchStatus = !collectorOk
        ? 'no_data'
        : totalCnt === 0
          ? 'empty'
          : (onlineCnt === 0 && !inOpenHours)
            ? 'closed'
            : (onlineCnt === 0 && inOpenHours)
              ? 'tunnel_down'
              : (onlineCnt < totalCnt ? 'partial_down' : 'ok');
      var isSilent = branchStatus === 'tunnel_down';
      var isClosed = branchStatus === 'closed';
      if (isSilent) silentBranches++;

      // Filter devices by search and online/offline filter
      var matchingDevs = visDevs.filter(function (d) {
        if (stFilter === 'online' && (!collectorOk || !d.online)) return false;
        if (stFilter === 'offline' && (!collectorOk || d.online)) return false;
        if (q) {
          var hay = (d.mac + ' ' + d.ip + ' ' + (d.label || '') + ' ' + (d.device_name || '') + ' ' + s.code + ' ' + s.name + ' ' + (s.ifaces || []).join(' ') + ' ' + (s.sys_ifaces || []).join(' ')).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });

      var siteMatchesQuery = !q || (s.code + ' ' + s.name + ' ' + (s.ifaces || []).join(' ') + ' ' + (s.sys_ifaces || []).join(' ')).toLowerCase().indexOf(q) !== -1;
      if (q && !matchingDevs.length && !siteMatchesQuery) return;
      if (stFilter === 'online' && onlineCnt === 0 && !q) return;
      if (stFilter === 'offline' && totalCnt > 0 && onlineCnt === totalCnt && !q) return;

      outSites.push({
        key: siteGroupKey(s),
        site_id: s.site_id,
        code: s.code,
        name: s.name,
        brand: s.brand,
        lat: s.lat,
        lng: s.lng,
        open_time: s.open_time || '08:00',
        close_time: s.close_time || '21:00',
        closed_dow: s.closed_dow || [],
        hours_note: s.hours_note || '',
        in_open_hours: inOpenHours,
        branch_status: branchStatus,
        ifaces: s.ifaces || [],
        sys_ifaces: s.sys_ifaces || [],
        online: onlineCnt,
        total: totalCnt,
        isSilent: isSilent,
        isClosed: isClosed,
        first_today: s.first_today,
        devices: matchingDevs,
        allDevices: visDevs,
        site_devices: s.site_devices || [],
        stale_inventory: s.stale_inventory || []
      });
    });

    // Sort: silent branches first, then branches with devices before empty ones, then by code
    outSites.sort(function (a, b) {
      if (a.isSilent !== b.isSilent) return a.isSilent ? -1 : 1;
      var aHas = a.total > 0 ? 1 : 0;
      var bHas = b.total > 0 ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return String(a.code).localeCompare(String(b.code));
    });

    return {
      collector_ok: collectorOk,
      totalOnline: totalOnline,
      totalDevices: totalDevices,
      silentBranches: silentBranches,
      unmappedCount: (data.unmapped_ifaces || []).length,
      sites: outSites
    };
  }

  // Branches that need attention, worst first. Uses unfiltered data so search/filter never hides a problem.
  // Branches with online === 0 outside their operating hours are marked 'closed' and excluded.
  function presenceProblems(data) {
    var showRand = state.presenceRandomMac;
    var out = [];
    (data.sites || []).forEach(function (s) {
      if (s.site_id === null || s.site_id === undefined) return; // unmapped ifaces have their own panel
      var devs = (s.devices || []).filter(function (d) { return showRand || !d.random_mac; });
      var online = devs.filter(function (d) { return d.online; }).length;
      if (!devs.length || online === devs.length) return;
      var inOpenHours = typeof s.in_open_hours === 'boolean'
        ? s.in_open_hours
        : inOpenHoursBkk(s.open_time, s.close_time, s.closed_dow, data.now);
      if (online === 0 && !inOpenHours) return; // closed outside operating hours is normal
      var lastSeen = '';
      devs.forEach(function (d) { if (d.last_seen > lastSeen) lastSeen = d.last_seen; });
      out.push({
        key: siteGroupKey(s),
        code: s.code,
        name: s.name,
        online: online,
        total: devs.length,
        down: devs.length - online,
        lastSeen: lastSeen,
        kind: online === 0 ? 'tunnel_down' : 'partial_down'
      });
    });
    out.sort(function (a, b) {
      var as = a.online === 0 ? 0 : 1;
      var bs = b.online === 0 ? 0 : 1;
      if (as !== bs) return as - bs;
      if (as === 0) return String(a.lastSeen).localeCompare(String(b.lastSeen)); // longest silent first
      return b.down - a.down;
    });
    return out;
  }

  function openRegisterPresenceDeviceModal(devRow, siteGroup) {
    openModal('ลงทะเบียนเครื่องใหม่เข้าสาขา ' + siteGroup.code, function (body, close) {
      body.appendChild(el('p', 'page-sub', 'MAC ' + devRow.mac + ' · IP ' + devRow.ip + ' (' + devRow.iface + ')'));
      var roleVal = 'POS';
      var fRole = el('div', 'field');
      fRole.appendChild(el('span', 'lbl', 'ประเภทเครื่อง *'));
      var rSeg = el('div', 'seg');
      ROLES.forEach(function (r) {
        var b = el('button', '', ROLE_LABELS[r]);
        b.type = 'button';
        b.setAttribute('aria-pressed', roleVal === r ? 'true' : 'false');
        b.addEventListener('click', function () {
          roleVal = r;
          [].forEach.call(rSeg.children, function (c, i) {
            c.setAttribute('aria-pressed', ROLES[i] === r ? 'true' : 'false');
          });
        });
        rSeg.appendChild(b);
      });
      fRole.appendChild(rSeg);
      body.appendChild(fRole);

      var fName = el('label', 'field');
      fName.appendChild(el('span', 'lbl', 'Computer Name *'));
      var iName = el('input', 'input');
      iName.value = devRow.label || (siteGroup.code + '-POS1');
      fName.appendChild(iName);
      body.appendChild(fName);

      var errEl = el('div', 'fielderr');
      body.appendChild(errEl);

      var act = el('div', 'row-actions');
      act.appendChild(btn('บันทึกและผูก MAC', 'primary', function () {
        var cname = iName.value.trim();
        if (!cname) {
          errEl.textContent = 'กรุณาระบุ Computer Name';
          iName.focus();
          return;
        }
        api('inventory_register_from_presence', {
          mac: devRow.mac,
          site_id: siteGroup.site_id,
          role: roleVal,
          computer_name: cname
        }).then(function () {
          close();
          showMsg('ลงทะเบียนเครื่อง ' + cname + ' และผูก MAC เรียบร้อยแล้ว', 'ok');
          loadPresence(false);
        }).catch(function (e) { errEl.textContent = e.message; });
      }));
      body.appendChild(act);
      iName.focus();
    });
  }

  function renderInventoryHealthPanel(data) {
    var unregistered = [];
    var suggested = [];
    var stale = [];
    (data.sites || []).forEach(function (s) {
      if (!s.site_id) return;
      (s.devices || []).forEach(function (d) {
        if (d.random_mac || d.device_id) return;
        unregistered.push({ site: s, dev: d });
        if (d.suggested_device) suggested.push({ site: s, dev: d });
      });
      (s.stale_inventory || []).forEach(function (st) {
        stale.push({ site: s, item: st });
      });
    });

    if (!unregistered.length && !stale.length) return null;

    var box = el('section', 'card');
    box.style.marginBottom = '12px';
    var head = el('div', 'item-head');
    var hLeft = el('div');
    hLeft.appendChild(el('strong', '', 'สุขภาพทะเบียนเครื่อง (เทียบไฟร์วอลล์กับทะเบียน MA)'));
    var badges = el('div', 'row-actions');
    badges.style.marginTop = '4px';
    if (suggested.length) badges.appendChild(el('span', 'badge warn', 'แนะนำให้ผูกอัตโนมัติ ' + suggested.length + ' เครื่อง'));
    if (unregistered.length) badges.appendChild(el('span', 'badge brand', 'เครื่องใหม่ยังไม่ลงทะเบียน ' + unregistered.length + ' เครื่อง'));
    if (stale.length) badges.appendChild(el('span', 'badge muted', 'อาจเลิกใช้ (>30 วัน) ' + stale.length + ' เครื่อง'));
    hLeft.appendChild(badges);
    head.appendChild(hLeft);

    var detailWrap = el('div');
    detailWrap.hidden = !state.presenceInvHealthOpen;
    var toggleBtn = btn(state.presenceInvHealthOpen ? 'ซ่อนรายการ' : 'ดูรายการ (' + (unregistered.length + stale.length) + ')', 'sm', function () {
      state.presenceInvHealthOpen = !state.presenceInvHealthOpen;
      detailWrap.hidden = !state.presenceInvHealthOpen;
      toggleBtn.querySelector('span').textContent = state.presenceInvHealthOpen ? 'ซ่อนรายการ' : 'ดูรายการ (' + (unregistered.length + stale.length) + ')';
    });
    head.appendChild(toggleBtn);
    box.appendChild(head);

    if (unregistered.length) {
      var uTitle = el('div', 'problem-group-title');
      uTitle.style.marginTop = '10px';
      uTitle.textContent = 'เครื่องใหม่ยังไม่ลงทะเบียนใน itm_devices (' + unregistered.length + ')';
      detailWrap.appendChild(uTitle);
      var uRows = el('div', 'problem-rows');
      unregistered.slice(0, 12).forEach(function (entry) {
        var s = entry.site, d = entry.dev;
        var r = el('div', 'problem-row is-partial');
        var nm = el('span', 'problem-name');
        nm.appendChild(el('span', 'site-code', s.code));
        nm.appendChild(document.createTextNode(' ' + (d.label || d.mac) + ' · IP ' + d.ip));
        if (d.suggested_device) {
          var sb = el('span', 'badge warn', 'ตรงกับ ' + d.suggested_device.computer_name);
          sb.style.marginLeft = '6px';
          nm.appendChild(sb);
        }
        r.appendChild(nm);
        var act = el('div', 'row-actions');
        act.style.marginTop = '0';
        if (d.suggested_device) {
          act.appendChild(btn('ยืนยันผูก', 'primary sm', function () {
            api('presence_label', {
              mac: d.mac,
              device_id: d.suggested_device.id,
              label: d.label || d.suggested_device.computer_name
            }).then(function () {
              showMsg('ผูก MAC ' + d.mac + ' กับ ' + d.suggested_device.computer_name + ' เรียบร้อยแล้ว', 'ok');
              loadPresence(false);
            }).catch(function (e) { showMsg(e.message, 'err'); });
          }));
        }
        act.appendChild(btn('ลงทะเบียนเข้าสาขา', 'sm', function () {
          openRegisterPresenceDeviceModal(d, s);
        }));
        r.appendChild(act);
        uRows.appendChild(r);
      });
      detailWrap.appendChild(uRows);
    }

    if (stale.length) {
      var sTitle = el('div', 'problem-group-title');
      sTitle.style.marginTop = '10px';
      sTitle.textContent = 'เครื่องในทะเบียนที่ไม่เห็นบนไฟร์วอลล์เกิน 30 วัน (' + stale.length + ')';
      detailWrap.appendChild(sTitle);
      var sRows = el('div', 'problem-rows');
      stale.slice(0, 12).forEach(function (entry) {
        var r = el('div', 'problem-row');
        var nm = el('span', 'problem-name');
        nm.appendChild(el('span', 'site-code', entry.site.code));
        nm.appendChild(document.createTextNode(' ' + entry.item.computer_name + ' (' + entry.item.role + ') · IP ' + (entry.item.ip || '-')));
        r.appendChild(nm);
        r.appendChild(el('span', 'problem-state', 'เห็นล่าสุด ' + thaiRelativeTime(entry.item.last_seen, data.now)));
        sRows.appendChild(r);
      });
      detailWrap.appendChild(sRows);
    }

    box.appendChild(detailWrap);
    return box;
  }

  function loadSecurityOverview() {
    var req = { days: state.securityDays || 7 };

      state.securityData = res;
      if (state.tab === 'devices' && state.presenceViewMode === 'security') {
        renderPresenceView(false);
      }
    }).catch(function (e) { showMsg(e.message, 'err'); });

  function renderSecuritySubView(host, presenceData) {
    host.innerHTML = '';
    var tb = el('div', 'toolbar');
    var dSeg = el('div', 'seg');
    [[7, '7 วันล่าสุด'], [30, '30 วันล่าสุด']].forEach(function (d) {
      var b = el('button', '', d[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', state.securityDays === d[0] ? 'true' : 'false');
      b.addEventListener('click', function () {
        state.securityDays = d[0];
        state.securityData = null;
        renderSecuritySubView(host, presenceData);
      });
      dSeg.appendChild(b);
    });
    tb.appendChild(dSeg);

    var siteOpts = [{ value: '', label: 'ทุกสาขา' }];
    (presenceData.sites || []).forEach(function (s) {
      if (s.site_id) siteOpts.push({ value: String(s.site_id), label: s.code + ' ' + s.name });
    });
    tb.appendChild(makeSelect(siteOpts, String(state.securitySiteId || ''), function (nv) {
      state.securitySiteId = nv;
      state.securityData = null;
      renderSecuritySubView(host, presenceData);
    }, 'กรองสาขา'));
    tb.appendChild(el('span', 'badge muted', 'ไม่เก็บ URL เต็มและไม่เก็บชื่อพนักงาน · บันทึกประวัติการเปิดดูใน itm_log'));
    host.appendChild(tb);

    if (!state.securityData) {
      host.appendChild(el('div', 'card', 'กำลังโหลดสรุปข้อมูลเว็บ (Content Filtering)...'));
      loadSecurityOverview();
      return;
    }

    var sec = state.securityData;
    var kpiGrid = el('div', 'kpi-grid');
    var lead = el('div', 'kpi-lead');
    var leadTop = el('div', 'kpi-lead-top');
    var leadL = el('div');
    leadL.appendChild(el('div', 'badge brand', 'เว็บที่ไม่ใช่เว็บงานปกติ (' + sec.days + ' วัน)'));
    leadL.appendChild(el('div', 'kpi-num-big', String(sec.total_hits) + ' ครั้ง'));
    leadTop.appendChild(leadL);
    var leadR = el('div');
    leadR.style.textAlign = 'right';
    leadR.appendChild(el('div', '', 'ถูกบล็อก (Denied) ' + sec.denied_hits + ' ครั้ง'));
    leadR.appendChild(el('div', 'page-sub', 'อนุญาต (Non-Productive) ' + sec.allowed_hits + ' ครั้ง'));
    leadTop.appendChild(leadR);

  function bkkMinuteOfDay(iso) {
    if (!iso) return null;
    var ms = Date.parse(iso);
    if (!Number.isFinite(ms)) return null;
    var d = new Date(ms + 7 * 3600 * 1000);
    return d.getUTCHours() * 60 + d.getUTCMinutes();
  }

  function hmToMinute(hm, def) {
    var m = /^(\d{2}):(\d{2})/.exec(String(hm || ''));
    if (!m) return def;
    return Number(m[1]) * 60 + Number(m[2]);
  }

  function shiftIsoDay(isoDay, deltaDays) {
    var p = isoDay.split('-').map(Number);
    var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2] + deltaDays));
    return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0') + '-' + String(dt.getUTCDate()).padStart(2, '0');
  }

  function mountSiteHistoryBox(host, siteGroup) {
    var sid = siteGroup.site_id;
    var cached = state.presenceHistCache[sid];
    if (cached) {
      drawSiteHistoryBox(host, siteGroup, cached);
      return;
    }
    host.textContent = 'กำลังโหลดประวัติออนไลน์ 30 วันล่าสุด...';
    api('presence_site_history', { site_id: sid, days: 30 }).then(function (res) {
      state.presenceHistCache[sid] = res;
      if (state.tab === 'devices' && String(state.presenceSelectedKey) === String(siteGroup.key)) {
        drawSiteHistoryBox(host, siteGroup, res);
      }
    }).catch(function () {
      host.textContent = 'ไม่สามารถโหลดประวัติ 30 วันได้ในขณะนี้';
    });
  }

  function drawSiteHistoryBox(host, siteGroup, hist) {
    host.innerHTML = '';
    var sid = siteGroup.site_id;
    var refToday = (state.presenceData && state.presenceData.now) ? state.presenceData.now.slice(0, 10) : bkkToday();
    var dayMap = {};
    (hist.days || []).forEach(function (d) { dayMap[d.day] = d; });
    var macByDay = {};
    (hist.mac_days || []).forEach(function (m) {
      if (!macByDay[m.day]) macByDay[m.day] = [];
      macByDay[m.day].push(m);
    });

    var slots = [];
    var activeDays = 0;
    var silentDays = 0;
    var totalSilentMins = 0;
    for (var i = 29; i >= 0; i--) {
      var dStr = shiftIsoDay(refToday, -i);
      var rec = dayMap[dStr] || null;
      if (rec) {
        activeDays++;
        if (rec.silent_open_mins > 0) {
          silentDays++;
          totalSilentMins += rec.silent_open_mins;
        }
      }
      slots.push({ day: dStr, rec: rec });
    }

    var selDay = state.presenceHistSelectedDay[sid];
    if (!selDay || !slots.some(function (s) { return s.day === selDay; })) {
      var lastWithData = slots.slice().reverse().find(function (s) { return !!s.rec; });
      selDay = lastWithData ? lastWithData.day : refToday;
      state.presenceHistSelectedDay[sid] = selDay;
    }

    var head = el('div', 'hist-head');
    var titleWrap = el('div');
    titleWrap.appendChild(el('strong', '', 'ประวัติออนไลน์ 30 วันล่าสุด'));
    var sInfo = hist.site || siteGroup;
    var openStr = sInfo.open_time || '08:00';
    var closeStr = sInfo.close_time || '21:00';
    var subText = (openStr === closeStr ? 'เปิด 24 ชั่วโมง' : 'เวลาทำการ ' + openStr + '-' + closeStr + ' น.')
      + (sInfo.hours_note ? ' · ' + sInfo.hours_note : '');
    titleWrap.appendChild(el('div', 'page-sub', subText));
    head.appendChild(titleWrap);

    var kpis = el('div', 'hist-kpis');
    kpis.appendChild(el('span', 'badge ok', 'มีข้อมูล ' + activeDays + '/30 วัน'));
    kpis.appendChild(
      el(
        'span',
        'badge ' + (silentDays > 0 ? 'err' : 'brand'),
        silentDays > 0 ? ('เงียบในเวลาทำการ ' + silentDays + ' วัน (รวม ' + totalSilentMins + ' นาที)') : 'ไม่พบช่วงเงียบในเวลาทำการ'
      )
    );
    head.appendChild(kpis);
    host.appendChild(head);

    // Inline SVG 30-day chart (00:00 top -> 24:00 bottom, with operating hours guides)
    var svgWrap = el('div', 'hist-svg-wrap');
    var W = 620, H = 148, padL = 38, padR = 10, padT = 14, padB = 24;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;
    var stepX = plotW / 30;
    var openMin = hmToMinute(openStr, 480);
    var closeMin = hmToMinute(closeStr, 1260);
    var yOfMin = function (m) { return Math.round(padT + (Math.max(0, Math.min(1440, m)) / 1440) * plotH); };

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('class', 'hist-svg');
    svg.setAttribute('role', 'group');
    svg.setAttribute('aria-label', 'กราฟประวัติออนไลน์ 30 วันล่าสุดของสาขา ' + siteGroup.code);

    // Time grid lines (00:00, 06:00, 12:00, 18:00, 24:00)
    [0, 360, 720, 1080, 1440].forEach(function (m) {
      var y = yOfMin(m);
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', String(padL));
      ln.setAttribute('x2', String(W - padR));
      ln.setAttribute('y1', String(y));
      ln.setAttribute('y2', String(y));
      ln.setAttribute('stroke', 'currentColor');
      ln.setAttribute('stroke-opacity', '0.12');
      svg.appendChild(ln);

      var tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', String(padL - 5));
      tx.setAttribute('y', String(y + 3));
      tx.setAttribute('text-anchor', 'end');
      tx.setAttribute('font-size', '9');
      tx.setAttribute('fill', 'currentColor');
      tx.setAttribute('fill-opacity', '0.65');
      tx.textContent = String(Math.floor(m / 60)).padStart(2, '0') + ':00';
      svg.appendChild(tx);
    });

    // Operating hours dashed boundary lines
    if (openMin !== closeMin) {
      [openMin, closeMin].forEach(function (m) {
        var y = yOfMin(m);
        var gl = document.createElementNS(NS, 'line');
        gl.setAttribute('x1', String(padL));
        gl.setAttribute('x2', String(W - padR));
        gl.setAttribute('y1', String(y));
        gl.setAttribute('y2', String(y));
        gl.setAttribute('stroke', 'var(--c-brand)');
        gl.setAttribute('stroke-dasharray', '3,3');
        gl.setAttribute('stroke-opacity', '0.55');
        svg.appendChild(gl);
      });
    }

    slots.forEach(function (sl, idx) {
      var cx = padL + idx * stepX + stepX / 2;
      var barW = Math.max(8, Math.round(stepX - 5));
      var bx = Math.round(cx - barW / 2);
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.style.cursor = 'pointer';
      var isSel = sl.day === selDay;

      // Selection background highlight
      if (isSel) {
        var selBg = document.createElementNS(NS, 'rect');
        selBg.setAttribute('x', String(bx - 2));
        selBg.setAttribute('y', String(padT - 4));
        selBg.setAttribute('width', String(barW + 4));
        selBg.setAttribute('height', String(plotH + 8));
        selBg.setAttribute('rx', '4');
        selBg.setAttribute('fill', 'var(--c-brand-soft)');
        selBg.setAttribute('stroke', 'var(--c-brand)');
        g.appendChild(selBg);
      }

      // Base track
      var track = document.createElementNS(NS, 'rect');
      track.setAttribute('x', String(bx));
      track.setAttribute('y', String(padT));
      track.setAttribute('width', String(barW));
      track.setAttribute('height', String(plotH));
      track.setAttribute('rx', '3');
      track.setAttribute('fill', 'currentColor');
      track.setAttribute('fill-opacity', '0.06');
      g.appendChild(track);

      if (sl.rec) {
        var fMin = bkkMinuteOfDay(sl.rec.first_seen);
        var lMin = bkkMinuteOfDay(sl.rec.last_seen);
        if (fMin === null) fMin = openMin;
        if (lMin === null || lMin < fMin) lMin = Math.min(1440, fMin + 60);
        var y1 = yOfMin(fMin);
        var y2 = Math.max(y1 + 6, yOfMin(lMin));
        var hasSilent = sl.rec.silent_open_mins > 0;

        var bar = document.createElementNS(NS, 'rect');
        bar.setAttribute('x', String(bx));
        bar.setAttribute('y', String(y1));
        bar.setAttribute('width', String(barW));
        bar.setAttribute('height', String(y2 - y1));
        bar.setAttribute('rx', '3');
        bar.setAttribute('fill', hasSilent ? 'var(--c-err)' : 'var(--c-ok)');
        g.appendChild(bar);
        g.setAttribute('aria-label', thaiDate(sl.day) + ' เปิด ' + bkkTimeHm(sl.rec.first_seen) + ' ถึง ' + bkkTimeHm(sl.rec.last_seen) + ' ออนไลน์สูงสุด ' + sl.rec.max_online + ' เครื่อง' + (hasSilent ? ' เงียบในเวลาทำการ ' + sl.rec.silent_open_mins + ' นาที' : ''));
      } else {
        g.setAttribute('aria-label', thaiDate(sl.day) + ' ไม่มีข้อมูล');
      }

      if (idx % 5 === 0 || idx === 29) {
        var dl = document.createElementNS(NS, 'text');
        dl.setAttribute('x', String(Math.round(cx)));
        dl.setAttribute('y', String(H - 6));
        dl.setAttribute('text-anchor', 'middle');
        dl.setAttribute('font-size', '9');
        dl.setAttribute('fill', 'currentColor');
        dl.setAttribute('fill-opacity', isSel ? '1' : '0.68');
        dl.textContent = Number(sl.day.slice(8, 10)) + '/' + Number(sl.day.slice(5, 7));
        g.appendChild(dl);
      }

      var chooseDay = function () {
        state.presenceHistSelectedDay[sid] = sl.day;
        drawSiteHistoryBox(host, siteGroup, hist);
      };
      g.addEventListener('click', chooseDay);
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          chooseDay();
        }
      });
      svg.appendChild(g);
    });

    svgWrap.appendChild(svg);
    host.appendChild(svgWrap);

    // Selected day detail panel
    var chosenSlot = slots.find(function (s) { return s.day === selDay; }) || slots[slots.length - 1];
    var det = el('div', 'hist-day-detail');
    if (!chosenSlot || !chosenSlot.rec) {
      det.appendChild(el('strong', '', 'วันที่ ' + thaiDate(selDay) + ' — ไม่มีข้อมูลบันทึกในวันนี้'));
    } else {
      var r = chosenSlot.rec;
      det.appendChild(
        el(
          'strong',
          '',
          'วันที่ ' + thaiDate(selDay) +
            ' · เครื่องแรกเปิด ' + bkkTimeHm(r.first_seen) +
            ' · เครื่องสุดท้าย ' + bkkTimeHm(r.last_seen) +
            ' · ออนไลน์สูงสุด ' + r.max_online + ' เครื่อง' +
            (r.silent_open_mins > 0 ? ' · เงียบในเวลาทำการ ' + r.silent_open_mins + ' นาที' : ' · ไม่เงียบในเวลาทำการ')
        )
      );
      var dayMacs = macByDay[selDay] || [];
      if (dayMacs.length) {
        var mList = el('div', 'hist-mac-list');
        dayMacs.forEach(function (m) {
          var name = m.label || m.device_name || m.mac;
          mList.appendChild(
            el('span', 'badge muted', name + ': ' + bkkTimeHm(m.first_seen) + ' - ' + bkkTimeHm(m.last_seen))
          );
        });
        det.appendChild(mList);
      }
    }
    host.appendChild(det);
  }

  function startApp(sess) {
    state.sess = sess;
    var td = bkkToday();
    state.month = td.slice(0, 7);
    state.year = Number(td.slice(0, 4));
    $('userName').textContent = sess.staff.n || sess.staff.u;

  function boot() {
    var params = new URLSearchParams(location.search);
    var sso = params.get('sso');
    if (sso) {
      // Strip single-use bridge token from URL immediately so refresh never replays it.
      history.replaceState(null, '', location.pathname + location.hash);
      showGate('กำลังยืนยันตัวตนจาก Job Tracker...', 'กรุณารอสักครู่');
      postFn('itm-session', { link: sso }).then(function (r) {
        if (r.status === 200 && r.data && r.data.session) {
          sessionStorage.setItem(STORE_KEY, JSON.stringify(r.data));
          startApp(r.data);
        } else {
          showGate('เข้าใช้งานไม่สำเร็จ', errText(r.data && r.data.error));
        }
      });
      return;
    }

    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(STORE_KEY) || 'null'); } catch (_e) {}
    if (saved && saved.session && saved.expiresAt && Date.now() < saved.expiresAt) {
      startApp(saved);
    } else {
      sessionStorage.removeItem(STORE_KEY);
      showGate('กรุณาเข้าใช้งานผ่าน Job Tracker', 'เปิดเมนู "IT MA" จากแถบข้างใน Job Tracker เพื่อเข้าสู่ระบบโดยไม่ต้องกรอกรหัสผ่าน');
    }
  }

  // Floating "back to top" button, shown once the page has scrolled.
  (function () {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'to-top';
    b.setAttribute('aria-label', 'กลับขึ้นด้านบน');
    b.title = 'กลับขึ้นด้านบน';
    b.hidden = true;
    b.appendChild(icon('up', 22));
    b.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: isReducedMotion() ? 'auto' : 'smooth' });
    });
    document.body.appendChild(b);
    var onScroll = function () { b.hidden = window.scrollY < 400; };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();

  boot();
})();
</script>
</body>
</html>
